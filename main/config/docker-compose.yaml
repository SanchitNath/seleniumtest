version: '0.3'

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MMYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/usr/lib/mysql